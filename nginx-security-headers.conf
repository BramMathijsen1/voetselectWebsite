# Nginx equivalent of the security headers in .htaccess.
#
# This is NOT a file Nginx auto-loads from the web root the way Apache reads
# .htaccess — it has no per-directory config mechanism. These lines need to go
# inside the actual server { } block for this site in Nginx's own config
# (e.g. /etc/nginx/sites-available/voetselect.nl, or wherever your host keeps
# it), which normally requires SSH/root access or a hosting-panel option that
# lets you edit or include custom Nginx directives. If you don't have that
# access yourself, hand this file to your hosting provider's support and ask
# them to add it to the site's server block.

# Prevent this site from ever being embedded in an iframe (clickjacking protection).
add_header X-Frame-Options "DENY" always;

# Stop browsers from guessing/re-interpreting file types.
add_header X-Content-Type-Options "nosniff" always;

# Only send the full referring URL to same-origin requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable browser features this site never uses.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Force HTTPS for a short period first — raise max-age once HTTPS is confirmed
# working on every page (a broken HTTPS setup + a long max-age here would lock
# visitors out of the site over HTTP for a long time).
add_header Strict-Transport-Security "max-age=3600" always;

# Don't let visitors browse raw folder contents when there's no index file.
autoindex off;
